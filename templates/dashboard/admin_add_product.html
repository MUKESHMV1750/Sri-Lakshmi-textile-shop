{% extends 'dashboard/admin_base.html' %}

{% block title %}Add Product{% endblock %}
{% block header_title %}Create New Product{% endblock %}

{% block content %}
<div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-200 max-w-3xl space-y-6">
    <form method="POST" action="{% url 'admin_add_product' %}" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Name</label>
                <input type="text" name="name" required placeholder="Royal Kanjeevaram Silk Saree" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Category</label>
                <select name="category" required class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Regular Price (₹)</label>
                <input type="number" step="0.01" name="price" required placeholder="14999" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Sale Price (₹)</label>
                <input type="number" step="0.01" name="sale_price" placeholder="11999" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">SKU</label>
                <input type="text" name="sku" required placeholder="LL-SLK-009" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Stock Quantity</label>
                <input type="number" name="stock" value="10" required class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Fabric</label>
                <input type="text" name="fabric" placeholder="Pure Mulberry Silk" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Brand</label>
                <input type="text" name="brand" value="LoomLuxe Heritage" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Description</label>
            <textarea name="description" rows="4" placeholder="Detailed product specifications..." class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black"></textarea>
        </div>

        <div class="bg-gray-50 p-5 rounded-2xl border border-gray-200 space-y-4">
            <label class="block text-xs font-extrabold uppercase text-gray-700">Product Images</label>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Option 1: Upload Image File(s)</label>
                    <input type="file" name="images" multiple accept="image/*" class="w-full bg-white border rounded-xl p-2.5 text-xs text-gray-600 focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Option 2: Image URL / Link(s)</label>
                    <textarea name="image_urls" rows="2" placeholder="Paste image web links (one per line, e.g. https://images.unsplash.com/...)" class="w-full bg-white border rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-black"></textarea>
                </div>
            </div>
            <p class="text-[11px] text-gray-400 italic">You can upload files from your device, paste direct image URL links, or use both.</p>
        </div>

        <div class="flex flex-wrap gap-4 pt-2">
            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer"><input type="checkbox" name="is_featured" class="accent-black w-4 h-4"><span>Featured</span></label>
            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer"><input type="checkbox" name="is_bestseller" class="accent-black w-4 h-4"><span>Bestseller</span></label>
            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer"><input type="checkbox" name="is_new_arrival" checked class="accent-black w-4 h-4"><span>New Arrival</span></label>
        </div>

        <div class="flex flex-wrap gap-3 pt-4 border-t border-gray-100">
            <button type="submit" class="bg-black text-white px-8 py-3.5 rounded-xl font-bold text-xs shadow-md">Create Product</button>
            <a href="{% url 'admin_products' %}" class="bg-gray-100 text-gray-700 px-6 py-3.5 rounded-xl font-bold text-xs text-center">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
