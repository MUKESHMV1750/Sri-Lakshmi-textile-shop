{% extends 'dashboard/admin_base.html' %}

{% block title %}Edit Product{% endblock %}
{% block header_title %}Edit Product: {{ product.name }}{% endblock %}

{% block content %}
<div class="bg-white p-6 sm:p-8 rounded-3xl shadow-sm border border-gray-200 max-w-3xl space-y-6">
    <form method="POST" action="{% url 'admin_edit_product' product.id %}" class="space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Product Name</label>
                <input type="text" name="name" value="{{ product.name }}" required class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Category</label>
                <select name="category" required class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Regular Price (₹)</label>
                <input type="number" step="0.01" name="price" value="{{ product.price }}" required class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Sale Price (₹)</label>
                <input type="number" step="0.01" name="sale_price" value="{{ product.sale_price|default:'' }}" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Stock Quantity</label>
                <input type="number" name="stock" value="{{ product.stock }}" required class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Description</label>
            <textarea name="description" rows="4" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">{{ product.description }}</textarea>
        </div>

        <div class="flex flex-wrap gap-4 pt-2">
            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer"><input type="checkbox" name="is_featured" {% if product.is_featured %}checked{% endif %} class="accent-black w-4 h-4"><span>Featured</span></label>
            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer"><input type="checkbox" name="is_bestseller" {% if product.is_bestseller %}checked{% endif %} class="accent-black w-4 h-4"><span>Bestseller</span></label>
            <label class="flex items-center space-x-2 text-xs font-bold cursor-pointer"><input type="checkbox" name="is_new_arrival" {% if product.is_new_arrival %}checked{% endif %} class="accent-black w-4 h-4"><span>New Arrival</span></label>
        </div>

        <div class="flex flex-wrap gap-3 pt-4 border-t border-gray-100">
            <button type="submit" class="bg-black text-white px-8 py-3.5 rounded-xl font-bold text-xs shadow-md">Update Product</button>
            <a href="{% url 'admin_products' %}" class="bg-gray-100 text-gray-700 px-6 py-3.5 rounded-xl font-bold text-xs text-center">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
