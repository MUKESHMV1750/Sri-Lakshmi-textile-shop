{% extends 'base.html' %}
{% load static %}

{% block title %}Complete Payment | LoomLuxe{% endblock %}

{% block content %}
<section class="max-w-xl mx-auto px-4 py-16 text-center">
    <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-xl space-y-6">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-2xl mx-auto">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight">Payment Verification</h1>
        <p class="text-gray-500 text-sm">Order #{{ order.order_number }} - Total Amount: <strong class="text-black text-lg">₹{{ order.total }}</strong></p>

        <div class="pt-4 border-t border-gray-100 space-y-4">
            <button id="rzp-button" class="w-full bg-black text-white py-4 rounded-2xl font-bold hover:bg-gray-800 transition-all shadow-md">
                Pay Now with Razorpay
            </button>
            <form action="{% url 'payment_callback' %}" method="POST" id="demo-payment-form">
                {% csrf_token %}
                <input type="hidden" name="razorpay_payment_id" value="pay_demo_success_123">
                <input type="hidden" name="razorpay_order_id" value="{{ order.order_number }}">
                <input type="hidden" name="razorpay_signature" value="demo_signature">
                <button type="submit" class="w-full bg-gray-100 text-gray-700 py-3 rounded-2xl font-bold text-xs hover:bg-gray-200 transition-all">
                    Simulate Payment Success (Demo Mode)
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
