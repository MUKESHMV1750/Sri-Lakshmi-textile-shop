{% extends 'base.html' %}
{% load static %}

{% block title %}Order Confirmed | LoomLuxe{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16 text-center">
    <div class="bg-white p-10 rounded-3xl border border-gray-100 shadow-xl space-y-6">
        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-4xl mx-auto">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-black">Order Placed Successfully!</h1>
        <p class="text-gray-500 text-sm">Thank you for shopping with LoomLuxe. Your order number is <strong class="text-black">#{{ order.order_number }}</strong>.</p>
        
        <div class="pt-4 space-y-3">
            <a href="{% url 'order_detail' order.order_number %}" class="block w-full bg-black text-white py-3.5 rounded-xl font-bold text-xs shadow-md">View Order Summary</a>
            <a href="{% url 'shop' %}" class="block w-full bg-gray-100 text-gray-700 py-3.5 rounded-xl font-bold text-xs hover:bg-gray-200">Continue Shopping</a>
        </div>
    </div>
</section>
{% endblock %}
