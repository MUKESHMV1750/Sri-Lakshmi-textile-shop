{% extends 'base.html' %}
{% load static %}

{% block title %}Return Status | LoomLuxe{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-16 text-center">
    <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-xl space-y-4">
        <h1 class="text-2xl font-extrabold tracking-tight">Return #{{ return_obj.id }}</h1>
        <p class="text-xs text-gray-500">Order #{{ return_obj.order.order_number }}</p>
        <span class="inline-block px-4 py-1.5 rounded-full font-bold uppercase text-xs bg-amber-100 text-amber-800">
            Status: {{ return_obj.get_status_display }}
        </span>
        <div class="pt-4 border-t border-gray-100">
            <a href="{% url 'return_list' %}" class="block w-full bg-black text-white py-3 rounded-xl text-xs font-bold">Back to Returns</a>
        </div>
    </div>
</section>
{% endblock %}
