{% extends 'base.html' %}
{% load static %}

{% block title %}Create Account | LoomLuxe{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-4 py-12 sm:py-16">
    <div class="bg-white p-6 sm:p-10 rounded-3xl border border-gray-100 shadow-xl space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-extrabold tracking-tight mb-2">Create Account</h1>
            <p class="text-gray-500 text-xs sm:text-sm">Join LoomLuxe for exclusive artisan drops and order tracking.</p>
        </div>

        <form method="POST" action="{% url 'register' %}" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">First Name</label>
                    <input type="text" name="first_name" value="{{ first_name|default:'' }}" required placeholder="Alex" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Last Name</label>
                    <input type="text" name="last_name" value="{{ last_name|default:'' }}" required placeholder="Morgan" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Email Address</label>
                <input type="email" name="email" value="{{ email|default:'' }}" required placeholder="name@example.com" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Phone Number</label>
                <input type="text" name="phone" value="{{ phone|default:'' }}" placeholder="+91 98765 43210" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="regPassword" name="password" required placeholder="••••••••" class="w-full border border-gray-200 rounded-xl pl-4 pr-12 py-3 text-sm focus:outline-none focus:border-black">
                    <button type="button" onclick="togglePasswordVisibility('regPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black p-2 focus:outline-none" title="Show / Hide Password">
                        <i class="fa-regular fa-eye text-base"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="regConfirmPassword" name="confirm_password" required placeholder="••••••••" class="w-full border border-gray-200 rounded-xl pl-4 pr-12 py-3 text-sm focus:outline-none focus:border-black">
                    <button type="button" onclick="togglePasswordVisibility('regConfirmPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black p-2 focus:outline-none" title="Show / Hide Password">
                        <i class="fa-regular fa-eye text-base"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full bg-black text-white py-3.5 rounded-xl font-bold hover:bg-gray-800 transition-all shadow-md flex items-center justify-center space-x-2">
                <i class="fa-solid fa-user-plus text-xs"></i>
                <span>Register Account</span>
            </button>
        </form>

        <div class="text-center pt-4 border-t border-gray-100">
            <p class="text-xs text-gray-500">Already have an account? <a href="{% url 'login' %}" class="font-bold text-black hover:underline">Sign In</a></p>
        </div>
    </div>
</section>

<script>
    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fa-regular fa-eye-slash text-base text-black';
        } else {
            input.type = 'password';
            icon.className = 'fa-regular fa-eye text-base text-gray-400';
        }
    }
</script>
{% endblock %}
