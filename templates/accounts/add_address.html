{% extends 'base.html' %}
{% load static %}

{% block title %}Add Address | LoomLuxe{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white p-8 rounded-3xl border border-gray-100 shadow-xl space-y-6">
        <h1 class="text-2xl font-extrabold tracking-tight">Add New Address</h1>

        <form method="POST" action="{% url 'add_address' %}" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Full Name</label>
                    <input type="text" name="full_name" required placeholder="Alex Morgan" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Phone Number</label>
                    <input type="text" name="phone" required placeholder="+91 98765 43210" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Street Address</label>
                <input type="text" name="address_line_1" required placeholder="Flat No, Building, Street" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">City</label>
                    <input type="text" name="city" required placeholder="Mumbai" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">State</label>
                    <input type="text" name="state" required placeholder="Maharashtra" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Pincode</label>
                    <input type="text" name="pincode" required placeholder="400001" class="w-full border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-black">
                </div>
            </div>

            <div class="flex items-center space-x-2 pt-2">
                <input type="checkbox" name="is_default" id="is_default" class="accent-black w-4 h-4">
                <label for="is_default" class="text-xs font-semibold text-gray-700">Set as default shipping address</label>
            </div>

            <div class="flex space-x-4 pt-4">
                <button type="submit" class="bg-black text-white px-8 py-3.5 rounded-xl font-bold text-xs shadow-md hover:bg-gray-800 transition-all">Save Address</button>
                <a href="{% url 'addresses' %}" class="bg-gray-100 text-gray-700 px-6 py-3.5 rounded-xl font-bold text-xs hover:bg-gray-200 transition-all">Cancel</a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
