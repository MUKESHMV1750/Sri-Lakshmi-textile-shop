services:
  - type: web
    name: Sri-Lakshmi-textile-shop
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://sri-lakshmi-textile-shop.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: sri-lakshmi-db
          property: connectionString

databases:
  - name: sri-lakshmi-db
    databaseName: sri_lakshmi_db
    user: sri_lakshmi_user


